<figure class="vascular-experience" data-vascular-scene data-mode="combined" aria-label="Interactive illustration of vascular sensing and aspiration">

      <title id="vascular-title">Blood flow, ultrasound and aspiration</title>
      <desc id="vascular-desc">A symbolic close-up of branching red vessels beside a metallic instrument. Light travels through the vessels, a blue ultrasound beam pulses toward them, and particles travel toward the adjacent aspiration channel. Select a mode below to explore each function.</desc>
      <defs>
        <radialGradient id="vascular-bg"><stop stop-color="#173b51"/><stop offset="1" stop-color="#071a2a"/></radialGradient>
        <linearGradient id="vessel-red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#852335"/><stop offset=".4" stop-color="#ce4055"/><stop offset=".64" stop-color="#9f233d"/><stop offset="1" stop-color="#481b30"/></linearGradient>
        <linearGradient id="instrument-metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#416176"/><stop offset=".25" stop-color="#d1e3ec"/><stop offset=".43" stop-color="#7a9eae"/><stop offset=".6" stop-color="#d7e7eb"/><stop offset="1" stop-color="#395466"/></linearGradient>

        <linearGradient id="ultrasound-light"><stop stop-color="#9ce9ff" stop-opacity=".5"/><stop offset="1" stop-color="#69ddfa" stop-opacity="0"/></linearGradient>
        <radialGradient id="sensing-glow"><stop stop-color="#9ae9fb" stop-opacity=".2"/><stop offset="1" stop-color="#9ae9fb" stop-opacity="0"/></radialGradient>
        <filter id="vessel-depth" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="5" dy="12" stdDeviation="9" flood-color="#020a12" flood-opacity=".8"/></filter>
        <filter id="signal-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2"/></filter>
        <path id="vessel-main" d="M-35 482 C107 469 123 386 191 338 S277 280 291 184 S363 115 435 -35"/>
        <path id="vessel-left" d="M200 331 C135 309 143 243 84 198 S30 120 -20 72"/>
        <path id="vessel-right" d="M265 268 C339 295 363 351 443 369 S522 465 635 475"/>
        <path id="vessel-upper" d="M291 184 C228 178 212 116 180 81 S127 24 147 -25"/>
        <path id="vessel-small" d="M112 222 C166 211 166 172 180 143"/>
        <path id="vessel-lower" d="M428 366 C402 425 339 443 342 553"/>

      <rect width="600" height="520" fill="url(#vascular-bg)"/>

        <g class="vascular-background" fill="none" stroke="#ba4865" stroke-linecap="round" opacity=".12"><path d="M-50 75C145 5 71 352 620 228" stroke-width="13"/><path d="M50 550C235 450 31 353 244 -50" stroke-width="8"/><path d="M380 550C603 228 360 190 609 30" stroke-width="10"/></g>

          <use href="#vessel-upper" stroke-width="19"/><use href="#vessel-left" stroke-width="26"/>
          <use href="#vessel-right" stroke-width="30"/><use href="#vessel-main" stroke-width="45"/>
        </g>
        <g fill="none" stroke="#f98b94" stroke-linecap="round" opacity=".26" transform="translate(-4 -5)"><use href="#vessel-main" stroke-width="9"/><use href="#vessel-left" stroke-width="5"/><use href="#vessel-right" stroke-width="6"/><use href="#vessel-upper" stroke-width="4"/></g>
        <g fill="none" stroke="#f9a0a6" stroke-opacity=".16" stroke-linecap="round" stroke-dasharray="1 15"><use href="#vessel-main" stroke-width="35"/><use href="#vessel-right" stroke-width="22"/><use href="#vessel-left" stroke-width="19"/></g>
        <g data-blood-particles fill="#ffabb0"></g>
        <g class="sensing-layer">
          <circle cx="276" cy="290" r="105" fill="url(#sensing-glow)"/>
          <g transform="translate(352 237) rotate(140)"><path d="M0 0L163 -64Q190 0 163 64Z" fill="url(#ultrasound-light)"/><g fill="none" stroke="#a5edff" stroke-width="1.3" data-ultrasound-waves></g></g>

          <path d="M0 -18H165" stroke="#e4f4ff" stroke-opacity=".75"/>
          <ellipse cx="-1" cy="-11" rx="6" ry="9" fill="#92d9f3" stroke="#c7f4ff" stroke-width="2"/>
          <ellipse cx="-1" cy="13" rx="6" ry="8" fill="#071929" stroke="#bed5dd" stroke-width="2"/>
          <text x="205" y="-11" fill="#e0ecf3" font-family="Arial,sans-serif" font-size="8" letter-spacing="2">ARGYS</text>
